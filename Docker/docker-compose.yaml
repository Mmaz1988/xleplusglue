services:
  redis:
    build:
      dockerfile: Docker/Dockerfile-redis
      context: ..
    ports:
      - '6379:6379'
      - '8083:8083'
    volumes:
      - ../redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  liger:
    build:
      dockerfile: Docker/Dockerfile-liger
      context: ..
      args:
        - platform=linux/amd64
    platform: linux/amd64
    ports:
      - '8080:8080'
    environment:
      # Raise to DEBUG for the per-rule detail; logback reads this from the env.
      LIGER_LOG_LEVEL: ${LIGER_LOG_LEVEL:-INFO}
  vampire:
    build:
      dockerfile: Docker/Dockerfile-vampire
      context: ..
      args:
       - platform=linux/amd64
    platform: linux/amd64
    ports:
      - '8082:8082'
    privileged: true  # Add this to enable privileged mode
    environment:
      REDIS_API_URL: http://redis:8083
      # Root log level for the FastAPI service; DEBUG restores the per-check
      # subprocess lines. Set LOG_DIR to also write LOG_DIR/<session key>.log
      # per run (mount it as a volume if you want the files on the host).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${VAMPIRE_LOG_DIR:-}
    depends_on:
      - redis
  gswb:
    build:
      dockerfile: Docker/Dockerfile-gswb
      context: ..
    ports:
      - '8081:8081'
    environment:
      LIGER_API_URL: http://liger:8080
      # Raise to DEBUG for per-item collapse/prover detail.
      GSWB_LOG_LEVEL: ${GSWB_LOG_LEVEL:-INFO}
    depends_on:
      - liger
  frontend:
    build:
      dockerfile: Docker/Dockerfile-frontend
      context: ..
    ports:
      - '80:80'
    depends_on:
        - gswb
        - liger
    restart: always
