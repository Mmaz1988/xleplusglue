services:
  redis:
    build:
      dockerfile: Docker/Dockerfile-redis
      context: ..
    ports:
      - '6379:6379'
      - '8083:8083'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  liger:
    build:
      dockerfile: Docker/Dockerfile-liger
      context: ..
      args:
        - platform=linux/amd64
    platform: linux/amd64
    ports:
      - '8080:8080'
  vampire:
    build:
      dockerfile: Docker/Dockerfile-vampire
      context: ..
      args:
       - platform=linux/amd64
    platform: linux/amd64
    ports:
      - '8082:8082'
    privileged: true  # Add this to enable privileged mode
    environment:
      REDIS_API_URL: http://redis:8083
    depends_on:
      - redis
  gswb:
    build:
      dockerfile: Docker/Dockerfile-gswb
      context: ..
    ports:
      - '8081:8081'
  frontend:
    build:
      dockerfile: Docker/Dockerfile-frontend
      context: ..
    ports:
      - '80:80'
    depends_on:
        - gswb
        - liger
    restart: always

volumes:
  redis-data:
