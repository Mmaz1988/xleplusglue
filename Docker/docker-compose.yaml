services:
  redis:
    build:
      dockerfile: Docker/Dockerfile-redis
      context: ..
    ports:
      - '6379:6379'
      - '8083:8083'
    volumes:
      - ../redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # A container with no limit can take the whole Docker VM down with it, and that is
    # what a wedged daemon looks like: no OOM record, no container exit, just an API that
    # stops answering. With a limit the kernel kills the container instead and SAYS so
    # (`docker inspect` reports OOMKilled), which is the difference between evidence and a
    # guess. Sized well above observed steady state (~490 MB) -- this is a backstop, not a
    # budget. Redis forks on AOF rewrite, transiently doubling its footprint, so leave room.
    mem_limit: 2g

  liger:
    build:
      dockerfile: Docker/Dockerfile-liger
      context: ..
      args:
        - platform=linux/amd64
    platform: linux/amd64
    ports:
      - '8080:8080'
    environment:
      # Raise to DEBUG for the per-rule detail; logback reads this from the env.
      LIGER_LOG_LEVEL: ${LIGER_LOG_LEVEL:-INFO}
  vampire:
    build:
      dockerfile: Docker/Dockerfile-vampire
      context: ..
    # Deliberately unpinned, so this builds and runs natively for the host: on Apple
    # Silicon the amd64 binary ran under QEMU and needed ~12s for proofs that take ~1.7s
    # native, which pushed checks past the 10s prover budget. Pinning it back to
    # linux/amd64 means also switching VAMPIRE_ARCH to Linux-X64 in Dockerfile-vampire.
    ports:
      - '8082:8082'
    privileged: true  # Add this to enable privileged mode
    environment:
      REDIS_API_URL: http://redis:8083
      # Root log level for the FastAPI service; DEBUG restores the per-check
      # subprocess lines. Set LOG_DIR to also write LOG_DIR/<session key>.log
      # per run (mount it as a volume if you want the files on the host).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${VAMPIRE_LOG_DIR:-}
      # Set VAMPIRE_KEEP_TPTP=true (env or .env) to persist every request's generated .p
      # (TPTP) proof files under the volume below instead of deleting them right after the
      # request finishes -- useful for inspecting exactly what was sent to Vampire during a
      # Chat or Regression Testing session. Off by default. A chat conversation's files are
      # grouped under tmp/<session>/turn-<NNN>/ and persist across container restarts (the
      # startup hook only ensures the mounted folder exists -- it no longer wipes it, since
      # that used to destroy an in-progress conversation's earlier turns on restart).
      VAMPIRE_KEEP_TPTP: ${VAMPIRE_KEEP_TPTP:-true}
    volumes:
      - ../inference/tmp:/vampire/tmp
    # Same backstop as redis: a run that grows without bound should kill its own container
    # and be visible in `docker inspect`, not take the daemon with it. Observed steady
    # state ~1 GB.
    mem_limit: 3g
    depends_on:
      redis:
        condition: service_healthy
  gswb:
    build:
      dockerfile: Docker/Dockerfile-gswb
      context: ..
    ports:
      - '8081:8081'
    environment:
      LIGER_API_URL: http://liger:8080
      # Raise to DEBUG for per-item collapse/prover detail.
      GSWB_LOG_LEVEL: ${GSWB_LOG_LEVEL:-INFO}
    depends_on:
      - liger
  lm:
    build:
      dockerfile: Docker/Dockerfile-lm
      context: ..
    # Unpinned like vampire, so it builds and runs natively for the host.
    ports:
      - '8084:8084'
    environment:
      # Any Hugging Face model with a fast tokenizer. Downloaded on first request into the
      # lm-models volume (roberta-large: ~1.4 GB, English-only), then reused.
      LM_MODEL: ${LM_MODEL:-FacebookAI/roberta-large}
      # Where /drs_provenance lives. Keep exactly one of these two lines active: LiGER running
      # on the host (e.g. from IntelliJ), or the liger service of this stack.
      LIGER_URL: http://host.docker.internal:8080
      # LIGER_URL: http://liger:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - lm-models:/models
    # No healthcheck: nothing waits on lm, and a probe every 10s only filled its log.
    # GET /health stays for a manual check.
    # Same backstop as the others. roberta-large on CPU stays under this.
    mem_limit: 3g
    # No depends_on: lm starts without LiGER and reports it unreachable per request, and
    # nothing depends on lm -- the client ranks when it is up and carries on when it is not.
  stanza:
    # UD parsing (docs/plans/UD_PARSING_PLAN.md). Optional: started only with
    # `docker compose --profile ud up`. Models come from Stanza/setup_stanza.sh.
    profiles: ['ud']
    build:
      dockerfile: Docker/Dockerfile-stanza
      context: ..
    ports:
      - '8085:8085'
    volumes:
      - ../Stanza/models:/stanza/models:ro
    mem_limit: 3g
  frontend:
    build:
      dockerfile: Docker/Dockerfile-frontend
      context: ..
    ports:
      - '80:80'
    depends_on:
        - gswb
        - liger
    restart: always

volumes:
  lm-models:
