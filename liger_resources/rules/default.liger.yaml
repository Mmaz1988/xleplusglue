# Default LiGER config: what the xleplusglue client loads on startup.
# Paths are relative to this file. Rule files of a stage are concatenated in order,
# so templates and hierarchies from an earlier file are visible to later ones.

# Rules applied to the parse before semantic composition (GSWB).
semantics:
  - degree_rules_lfgxdrt.liger
  - tam_rules_lfgxdrt.liger

# Post-processing rules, applied to the merged syntax + DRS of a sentence or sequence.
pragmatics:
  - pragmatics/core.liger
  - pragmatics/presupposition.liger
  - pragmatics/pronouns.liger

# Dictionaries for lex(value,dictionary), available to every rule set above.
lexica:
  - ../dicts/ling_dict_eng.txt
